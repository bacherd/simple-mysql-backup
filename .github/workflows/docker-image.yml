name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
  
    - name: docker login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PUSH_TOKEN }}
  
    - name: build docker image
      run: docker build . --file Dockerfile --tag ${{ secrets.DOCKER_USER }}/simple-mysql-backup
  
    - name: docker push
      if: github.event_name != 'pull_request'
      run: docker push ${{ secrets.DOCKER_USER }}/simple-mysql-backup
  
    - name: docker push readme
      if: github.event_name != 'pull_request'
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PUSH_TOKEN }}
        repository: ${{ secrets.DOCKER_USER }}/simple-mysql-backup
